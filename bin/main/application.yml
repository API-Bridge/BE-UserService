# =============================================================================
# User Service Configuration File
# =============================================================================

spring:
  application:
    name: USER-SERVICE
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # JPA 설정 (Amazon Corretto 17 최적화)
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        globally_quoted_identifiers: false
        globally_quoted_identifiers_skip_column_definitions: true
    show-sql: false
    open-in-view: false

  # Redis 설정
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # 데이터베이스 설정 (default 프로필: H2 인메모리 DB)
  datasource:
    url: ${DB_URL:jdbc:h2:mem:defaultdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  # 개발 환경용 기본 보안 설정 및 OAuth2 Resource Server 설정
  security:
    user:
      name: admin
      password: admin
      roles: USER,ADMIN
    oauth2:
      resourceserver:
        jwt:
          # Auth0 Issuer URI (JWT 발급자)
          issuer-uri: ${AUTH0_ISSUER_URI:https://api-bridge.us.auth0.com/}
          # JWKS URI (공개키 엔드포인트) - 자동 설정됨
          # jwk-set-uri: ${AUTH0_ISSUER_URI}/.well-known/jwks.json

  # H2 콘솔 설정 (default 프로필용)
  h2:
    console:
      enabled: true
      path: /h2-console

  sql:
    init:
      mode: never

  # Kafka 설정
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${SERVICE_NAME:user-svc}-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        max.poll.records: 500
        enable.auto.commit: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        acks: all
        retries: 3



# 서버 설정
server:
  port: 8081

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  cache:
    disabled: true

# Stripe 설정
stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_your_test_key_here}
  public-key: ${STRIPE_PUBLIC_KEY:pk_test_your_test_key_here}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_your_webhook_secret_here}
  # Stripe에 등록된 Product IDs
  products:
    free: ${STRIPE_FREE_PRODUCT_ID:prod_Ss3CAEwmeB1QuU}
    pro: ${STRIPE_PRO_PRODUCT_ID:prod_Ss3ChLEOuz3Km9}
    enterprise: ${STRIPE_ENTERPRISE_PRODUCT_ID:prod_enterprise_plan}
  # Stripe에 등록된 Price IDs
  prices:
    pro-monthly: ${STRIPE_PRO_MONTHLY_PRICE_ID:price_pro_monthly}
    pro-yearly: ${STRIPE_PRO_YEARLY_PRICE_ID:price_pro_yearly}
    enterprise-monthly: ${STRIPE_ENTERPRISE_MONTHLY_PRICE_ID:price_enterprise_monthly}
    enterprise-yearly: ${STRIPE_ENTERPRISE_YEARLY_PRICE_ID:price_enterprise_yearly}

# Circuit Breaker 설정 (Resilience4j)
resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 100
        permittedNumberOfCallsInHalfOpenState: 10
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 20
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 3s
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
  bulkhead:
    instances:
      default:
        maxConcurrentCalls: 10

# 로깅 설정
logging:
  level:
    root: INFO
    org.example.usersvc: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

# 모니터링 및 관리 설정
management:
  # 웹 엔드포인트 노출 설정
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
      base-path: /actuator

  # 개별 엔드포인트 상세 설정
  endpoint:
    health:
      show-details: when-authorized

  # 프로메테우스 익스포터 설정
  prometheus:
    metrics:
      export:
        enabled: true

  # 모든 메트릭에 적용될 공통 태그 설정
  metrics:
    tags:
      service: user-svc
      version: ${BUILD_VERSION:dev}

  # 분산 트레이싱 샘플링 설정
  tracing:
    sampling:
      probability: 1.0

# Auth0 설정 (API Gateway와 동일한 설정)
auth0:
  issuerUri: ${AUTH0_ISSUER_URI:https://api-bridge.us.auth0.com/}
  audience: ${AUTH0_AUDIENCE:https://api.api-bridge.com}  # JWT 토큰의 실제 audience와 일치
  client-id: ${AUTH0_CLIENT_ID}
  logout-redirect-uri: ${AUTH0_LOGOUT_REDIRECT_URI:http://localhost:8080/auth/logout-success}

# Eureka 클라이언트 설정
eureka:
  client:
    enabled: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
    # 서비스 레지스트리 갱신 주기
    registry-fetch-interval-seconds: 10
    # 초기 레지스트리 로딩 대기 시간
    initial-instance-info-replication-interval-seconds: 5
    # Eureka 서버 연결 설정
    eureka-server-connect-timeout-seconds: 5
    eureka-server-read-timeout-seconds: 8
  instance:
    # IP 주소 우선 사용 (Docker/K8s 환경 대응)
    prefer-ip-address: true
    # 고유한 인스턴스 ID 생성
    instance-id: ${spring.application.name}:${spring.cloud.client.hostname}:${server.port}
    # 하트비트 간격
    lease-renewal-interval-in-seconds: 10
    # 인스턴스 만료 시간
    lease-expiration-duration-in-seconds: 30
    # 헬스체크 URL 설정
    health-check-url-path: /actuator/health
    status-page-url-path: /actuator/info
    # 메타데이터 설정
    metadata-map:
      version: ${BUILD_VERSION:1.0.0}
      environment: ${SPRING_PROFILES_ACTIVE:default}
      management.port: ${server.port}
      # Auth0 관련 메타데이터
      auth.issuer: ${auth0.issuerUri}
      auth.audience: ${auth0.audience}
      # 서비스 특성 메타데이터
      service.type: user-management
      service.capabilities: user-crud,profile-management,authentication

---
# 개발 환경 설정
spring:
  config:
    activate:
      on-profile: dev
  
  # 개발 환경에서는 H2 인메모리 DB 사용
  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

# 개발 환경 로깅 설정 (기본 설정을 덮어씀)
logging:
  level:
    org.example.usersvc: DEBUG
    org.springframework.security: DEBUG

---
# 프로덕션 환경 설정
spring:
  config:
    activate:
      on-profile: prod

  # 프로덕션 환경에서는 MySQL 사용
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_service_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1111}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  h2:
    console:
      enabled: false

# 프로덕션 환경 로깅 설정
logging:
  level:
    org.example.usersvc: INFO
    org.springframework.security: WARN
  file:
    name: logs/user-svc.log

# 프로덕션 환경 관리 설정
management:
  endpoint:
    health:
      show-details: never