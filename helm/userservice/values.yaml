# Default values for userservice.
# This is a YAML-formatted file.
# Declare variables to be substituted into your templates.

replicaCount: 1

image:
  repository: 465516136472.dkr.ecr.ap-southeast-2.amazonaws.com/api-bridge/user-svc
  pullPolicy: IfNotPresent
  tag: "1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

serviceEndpoints:
  userServiceUrl: "http://user-service:80"

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

ingress:
  enabled: false
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  hosts:
    - host: userservice.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: userservice-tls
      hosts:
        - userservice.yourdomain.com

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Spring Boot configuration
config:
  spring:
    profiles:
      active: prod
  server:
    port: 8081

# ------------------------------------------------------------------
#  ✅ Improvement: 모든 비민감 환경 변수를 'env' 블록 아래로 통합하여 관리를 일원화합니다.
# ------------------------------------------------------------------
env:
  # Spring Boot & Server Config
  SERVER_PORT: "8081"
  SPRING_PROFILES_ACTIVE: "trusted-gateway"

  # Application Specific
  SERVICE_NAME: "user-svc"
  BUILD_VERSION: "1.0.0"
  DDL_AUTO: "validate"
  DB_DRIVER: "com.mysql.cj.jdbc.Driver"

  # Environment-dependent values
  DB_URL: "jdbc:mysql://mysql:3306/user_svc_db?useSSL=false&serverTimezone=UTC"
  REDIS_HOST: "master.your-redis-cluster.ab12cd.apn2.cache.amazonaws.com"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

  # Sensitive value placeholders (will be overridden by secrets)
  DB_USERNAME: ""
  DB_PASSWORD: ""
  AUTH0_ISSUER_URI: ""
  AUTH0_AUDIENCE: ""
  AUTH0_CLIENT_ID: ""
  TOSSPAY_SECRET_KEY: ""
  TOSSPAY_CLIENT_ID: ""
  TOSSPAY_WEBHOOK_SECRET: ""

# External secrets (create these in your cluster)
secrets:
  database:
    enabled: true
    name: userservice-db-secret
  auth0:
    enabled: true
    name: userservice-auth0-secret
  tosspay:
    enabled: true
    name: userservice-tosspay-secret

# ✅ Improvement: Probe 설정을 더 명확한 구조로 변경합니다.
# deployment.yaml에서 이 값들을 직접 참조합니다.
livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    # port는 deployment.yaml에서 'http'로 고정되므로 여기서 지정할 필요가 없습니다.
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
# Monitoring
serviceMonitor:
  enabled: true
  path: /actuator/prometheus
  interval: 30s

# Dependencies
dependencies:
  mysql:
    enabled: false  # Set to true if you want to deploy MySQL as part of this chart
  redis:
    enabled: false  # Set to true if you want to deploy Redis as part of this chart