version: '3.8'

services:
  # User Service Application
  user-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      # Override specific values for Docker environment
      - SPRING_PROFILES_ACTIVE=trusted-gateway
      - SPRING_APPLICATION_NAME=user-service
      - SERVICE_NAME=user-service
      - DDL_AUTO=update
      - DB_URL=jdbc:mysql://mysql:3306/user_svc_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true
      - DB_USERNAME=root
      - DB_PASSWORD=cell4086
      # External services (already running containers)
      - REDIS_HOST=APIBridge-Redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # ELK Stack connection (optional)
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    # JSON 로그 형식으로 출력 (Filebeat 수집용)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
      - external-services
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # MySQL Database
  mysql:
    image: mysql:8.0
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: cell4086
      MYSQL_DATABASE: user_svc_db
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge
  external-services:
    external: true

volumes:
  mysql_data:

# 사용법:
# 로컬 개발: docker-compose -f docker-compose.local.yml up -d
# 애플리케이션 실행: ./gradlew bootRun