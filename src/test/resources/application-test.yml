spring:
  application:
    name: user-svc-test
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    defer-datasource-initialization: true
  
  sql:
    init:
      mode: never
        
  h2:
    console:
      enabled: true
      
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: test-group
    producer:
      bootstrap-servers: ${spring.embedded.kafka.brokers}
      
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.example.Usersvc: DEBUG
    org.springframework.security: DEBUG
    org.springframework.kafka: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

wiremock:
  server:
    port: 0

stripe:
  secret-key: sk_test_fake_key_for_testing
  public-key: pk_test_fake_key_for_testing
  webhook-secret: whsec_fake_webhook_secret_for_testing
  products:
    free: prod_fake_free_plan
    pro: prod_fake_pro_plan
    enterprise: prod_fake_enterprise_plan
  prices:
    pro-monthly: price_fake_pro_monthly
    pro-yearly: price_fake_pro_yearly
    enterprise-monthly: price_fake_enterprise_monthly
    enterprise-yearly: price_fake_enterprise_yearly