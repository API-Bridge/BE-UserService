spring:
  application:
    name: user-svc-test
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
  
  profiles:
    active: test
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    defer-datasource-initialization: true
  
  sql:
    init:
      mode: never
        
  h2:
    console:
      enabled: false

  security:
    user:
      name: test
      password: test

logging:
  level:
    org.example.Usersvc: WARN
    org.springframework: WARN
    org.hibernate: WARN
    root: WARN

# 테스트에서 필요한 최소한의 설정들
stripe:
  secret-key: sk_test_fake_key_for_testing
  public-key: pk_test_fake_key_for_testing
  webhook-secret: whsec_fake_webhook_secret_for_testing
  products:
    free: prod_fake_free_plan
    pro: prod_fake_pro_plan
  prices:
    pro-monthly: price_fake_pro_monthly

toss:
  client-key: test_client_key
  secret-key: test_secret_key
  success-url: http://test.com/success
  fail-url: http://test.com/fail
  confirm-url: http://test.com/confirm
  prices:
    proMonthly: 22000
    freeMonthly: 0

auth0:
  issuerUri: https://test.auth0.com/
  audience: https://test.api.com
  client-id: test_client_id
  logout-redirect-uri: http://test.com/logout

# 기본 환경변수 대체값들
management:
  endpoints:
    web:
      exposure:
        include: health