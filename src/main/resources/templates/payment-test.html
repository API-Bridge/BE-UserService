<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토스페이 결제 테스트</title>
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            background-color: #f8f9fa;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <h1>🚀 토스페이 결제 테스트</h1>
    
    <div class="form-group">
        <label for="userId">사용자 ID:</label>
        <input type="text" id="userId" value="test-user-001" placeholder="사용자 ID 입력">
    </div>
    
    <div class="form-group">
        <label for="planName">플랜 타입:</label>
        <select id="planName">
            <option value="PRO">PRO (22원)</option>
            <option value="FREE">FREE (0원)</option>
        </select>
    </div>
    
    <button onclick="startPayment()">결제 시작</button>
    <button onclick="testHeaders()" style="background-color: #28a745; margin-left: 10px;">헤더 테스트</button>
    
    <div id="result" class="result" style="display: none;"></div>
    
    <script>
        let tossPayments;
        let widgets;
        
        // 토스페이먼츠 초기화 (테스트 클라이언트 키)
        function initTossPayments(clientKey) {
            if (typeof TossPayments === 'undefined') {
                throw new Error('토스페이먼츠 SDK가 로드되지 않았습니다. 페이지를 새로고침해주세요.');
            }
            tossPayments = TossPayments(clientKey);
        }
        
        async function startPayment() {
            const userId = document.getElementById('userId').value;
            const planName = document.getElementById('planName').value;
            
            console.log('🔧 결제 시작 - userId:', userId, 'planName:', planName);
            
            if (!userId) {
                showResult('사용자 ID를 입력해주세요.', 'error');
                return;
            }
            
            try {
                showResult('결제 요청 중...', 'success');
                
                // 헤더 및 요청 정보 디버깅
                const headers = {
                    'Content-Type': 'application/json',
                    'X-User-Id': userId
                };
                
                const requestBody = {
                    planName: planName,
                    provider: 'TOSSPAY'
                };
                
                console.log('📤 요청 헤더:', headers);
                console.log('📤 요청 본문:', requestBody);
                console.log('📤 전체 요청 정보:', {
                    url: '/api/tosspay/subscribe',
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestBody)
                });
                
                // 1. 결제 요청 API 호출
                const response = await fetch('/api/tosspay/subscribe', {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(requestBody)
                });
                
                console.log('📥 응답 상태:', response.status);
                console.log('📥 응답 헤더:', response.headers);
                
                const result = await response.json();
                console.log('📥 응답 결과:', result);
                
                if (!result.success) {
                    console.error('❌ 결제 요청 실패:', result);
                    throw new Error(result.message || '결제 요청 실패');
                }
                
                const paymentData = result.data;
                console.log('✅ 결제 데이터:', paymentData);
                
                // 2. 토스페이먼츠 SDK 로드 대기
                console.log('⏳ 토스페이먼츠 SDK 로드 대기 중...');
                await waitForTossPayments();
                
                // 3. 토스페이먼츠 초기화
                initTossPayments(paymentData.clientKey);
                
                // 4. V1 API 사용하여 결제 요청
                await tossPayments.requestPayment('카드', {
                    amount: paymentData.amount,
                    orderId: paymentData.orderId,
                    orderName: paymentData.orderName,
                    successUrl: window.location.origin + "/api/tosspay/success",
                    failUrl: window.location.origin + "/api/tosspay/fail",
                    customerEmail: paymentData.customerEmail,
                    customerName: paymentData.customerName,
                });
                
            } catch (error) {
                console.error('❌ 결제 오류 상세:', {
                    error: error,
                    message: error.message,
                    stack: error.stack,
                    name: error.name
                });
                
                // 네트워크 오류인지 확인
                if (error instanceof TypeError && error.message.includes('fetch')) {
                    console.error('🌐 네트워크 오류 감지');
                    showResult('네트워크 오류: ' + error.message, 'error');
                } else {
                    showResult('결제 오류: ' + error.message, 'error');
                }
            }
        }
        
        // 헤더 전송 테스트 함수
        async function testHeaders() {
            const userId = document.getElementById('userId').value;
            console.log('🧪 헤더 테스트 시작 - userId:', userId);
            
            if (!userId) {
                showResult('사용자 ID를 입력해주세요.', 'error');
                return;
            }
            
            try {
                showResult('헤더 테스트 중...', 'success');
                
                const headers = {
                    'Content-Type': 'application/json',
                    'X-User-Id': userId
                };
                
                console.log('🧪 테스트 헤더:', headers);
                
                const response = await fetch('/api/tosspay/debug/headers', {
                    method: 'GET',
                    headers: headers
                });
                
                console.log('🧪 헤더 테스트 응답 상태:', response.status);
                
                const result = await response.json();
                console.log('🧪 헤더 테스트 결과:', result);
                
                if (result.success) {
                    showResult(`
                        <h3>✅ 헤더 테스트 성공!</h3>
                        <p><strong>X-User-Id:</strong> ${result.data['X-User-Id']}</p>
                        <p><strong>모든 헤더:</strong> ${JSON.stringify(result.data.allHeaders, null, 2)}</p>
                    `, 'success');
                } else {
                    showResult(`❌ 헤더 테스트 실패: ${result.message}`, 'error');
                }
                
            } catch (error) {
                console.error('🧪 헤더 테스트 오류:', error);
                showResult('헤더 테스트 오류: ' + error.message, 'error');
            }
        }
        
        function showResult(message, type = 'success') {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message;
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';
        }
        
        // SDK 로드 완료 대기
        function waitForTossPayments() {
            return new Promise((resolve, reject) => {
                // 이미 로드되어 있는지 먼저 확인
                if (typeof TossPayments !== 'undefined') {
                    console.log('✅ 토스페이먼츠 SDK 이미 로드됨');
                    resolve();
                    return;
                }
                
                let attempts = 0;
                const maxAttempts = 30; // 3초 대기로 단축
                
                const checkSDK = () => {
                    attempts++;
                    console.log(`🔍 SDK 로드 확인 중... (${attempts}/${maxAttempts})`);
                    console.log('현재 window 객체에서 TossPayments:', typeof TossPayments);
                    console.log('window.TossPayments:', window.TossPayments);
                    
                    if (typeof TossPayments !== 'undefined' && TossPayments) {
                        console.log('✅ 토스페이먼츠 SDK 로드 완료');
                        resolve();
                    } else if (attempts >= maxAttempts) {
                        console.error('❌ SDK 로드 실패. 사용 가능한 전역 변수:', Object.keys(window).filter(key => key.toLowerCase().includes('toss')));
                        reject(new Error('토스페이먼츠 SDK 로드 시간 초과'));
                    } else {
                        setTimeout(checkSDK, 100);
                    }
                };
                
                checkSDK();
            });
        }

        // URL 파라미터 확인 (결제 성공/실패 시)
        window.addEventListener('load', async function() {
            // SDK 로드 대기
            try {
                await waitForTossPayments();
                showResult('토스페이먼츠 SDK가 준비되었습니다.', 'success');
            } catch (error) {
                showResult('토스페이먼츠 SDK 로드에 실패했습니다: ' + error.message, 'error');
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const paymentKey = urlParams.get('paymentKey');
            const orderId = urlParams.get('orderId');
            const amount = urlParams.get('amount');
            
            if (paymentKey && orderId && amount) {
                showResult(`
                    <h3>🎉 결제 성공!</h3>
                    <p><strong>결제키:</strong> ${paymentKey}</p>
                    <p><strong>주문번호:</strong> ${orderId}</p>
                    <p><strong>결제금액:</strong> ${amount}원</p>
                    <p>결제 승인이 완료되었습니다!</p>
                `, 'success');
            }
            
            const code = urlParams.get('code');
            const message = urlParams.get('message');
            
            if (code && message) {
                showResult(`
                    <h3>❌ 결제 실패</h3>
                    <p><strong>오류코드:</strong> ${code}</p>
                    <p><strong>오류메시지:</strong> ${message}</p>
                `, 'error');
            }
        });
    </script>
</body>
</html>
