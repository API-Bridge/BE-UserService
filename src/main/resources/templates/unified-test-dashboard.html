<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 통합 테스트 대시보드 | UserService</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: -50%;
            width: 200%;
            height: 100%;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 10px,
                rgba(255,255,255,0.05) 10px,
                rgba(255,255,255,0.05) 20px
            );
            animation: shimmer 20s linear infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 600;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.95;
            max-width: 600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .content {
            padding: 40px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .section h2 {
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid #4facfe;
        }

        .section h2::before {
            margin-right: 12px;
            font-size: 1.6rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #495057;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4facfe;
            box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
            transform: translateY(-1px);
        }

        .btn {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .btn-danger {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
        }

        .btn-danger:hover {
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.3);
        }

        .api-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }

        .api-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .api-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4facfe, #00f2fe);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .api-card:hover::before {
            transform: scaleX(1);
        }

        .api-card:hover {
            border-color: #4facfe;
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(79, 172, 254, 0.2);
        }

        .api-card.selected {
            border-color: #4facfe;
            background: linear-gradient(135deg, #f0f8ff 0%, #e6f3ff 100%);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.3);
        }

        .api-card.selected::before {
            transform: scaleX(1);
        }

        .api-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .api-description {
            color: #6c757d;
            margin-bottom: 15px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .api-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 15px;
        }

        .api-actions {
            display: flex;
            gap: 8px;
        }

        .status-message {
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 10px;
            font-weight: 500;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-left: 4px solid;
        }

        .status-message::before {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        .success {
            background: linear-gradient(135deg, #d4edda 0%, #c3e6cb 100%);
            color: #155724;
            border-left-color: #28a745;
        }

        .success::before {
            content: '✅';
        }

        .error {
            background: linear-gradient(135deg, #f8d7da 0%, #f5c6cb 100%);
            color: #721c24;
            border-left-color: #dc3545;
        }

        .error::before {
            content: '❌';
        }

        .info {
            background: linear-gradient(135deg, #d1ecf1 0%, #bee5eb 100%);
            color: #0c5460;
            border-left-color: #17a2b8;
        }

        .info::before {
            content: 'ℹ️';
        }

        .loading {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(79, 172, 254, 0.2);
            border-top: 2px solid #4facfe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }

        /* 플랜 제한 및 사용량 스타일 */
        .plan-limits ul, .usage-stats ul {
            list-style: none;
            padding: 0;
            margin: 10px 0;
        }

        .plan-limits li {
            padding: 6px 0;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .plan-limits li:last-child {
            border-bottom: none;
        }

        .usage-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 10px 0;
        }

        .usage-item {
            background: white;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .usage-label {
            font-weight: 500;
            color: #6c757d;
            font-size: 0.9rem;
        }

        .usage-value {
            font-weight: 600;
            color: #28a745;
            font-size: 1rem;
        }

        .plan-limits h4, .usage-stats h4 {
            margin: 0 0 10px 0;
            color: #495057;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            color: white;
        }

        .badge.active {
            background: linear-gradient(135deg, #28a745 0%, #34ce57 100%);
        }

        .badge.inactive {
            background: linear-gradient(135deg, #6c757d 0%, #8d9498 100%);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #4facfe;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #6c757d;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            
            .api-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <div class="header">
            <h1>🚀 통합 테스트 대시보드</h1>
            <p>
                구독 결제, 공유 API, 사용자 관리 등 모든 기능을 한 곳에서 테스트할 수 있습니다.<br>
                실시간으로 시스템 전체를 확인하고 관리해보세요.
            </p>
        </div>

        <div class="content">
            <!-- 통계 현황 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalUsers">6</div>
                    <div class="stat-label">등록된 사용자</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="totalSharedApis">-</div>
                    <div class="stat-label">전체 공유 API</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="mySharedApis">-</div>
                    <div class="stat-label">내가 공유한 API</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number" id="savedApis">-</div>
                    <div class="stat-label">저장한 API</div>
                </div>
            </div>

            <!-- 구독 결제 테스트 -->
            <div class="section">
                <h2>💳 구독 결제 테스트</h2>
                <div class="form-grid">
                    <div>
                        <div class="form-group">
                            <label>현재 사용자 선택:</label>
                            <select id="subscriptionUserId" onchange="updateSubscriptionUser()">
                                <option value="user-001">user-001 (testuser1@example.com) - Free 플랜</option>
                                <option value="user-002" selected>user-002 (testuser2@example.com) - Pro 플랜</option>
                                <option value="user-003">user-003 (admin@example.com) - Pro 플랜</option>
                                <option value="user-004">user-004 (developer@example.com) - Free 플랜</option>
                                <option value="user-005">user-005 (premium@example.com) - Pro 플랜</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>플랜 선택:</label>
                            <select id="planSelection">
                                <option value="price_1RwJ5zDefwpzeE1sRhAYJn4b">Pro 월간 ($22/월)</option>
                                <option value="price_1RwJ5zDefwpzeE1sRhAYJn4b">Pro 연간 ($220/년)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>현재 구독 상태:</label>
                            <div id="currentSubscriptionStatus" style="padding: 10px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e9ecef;">
                                <span style="color: #6c757d;">로딩 중...</span>
                            </div>
                        </div>
                        
                        <!-- 플랜 제한 표시 섹션 -->
                        <div class="form-group">
                            <label>플랜 제한 정보:</label>
                            <div id="planLimitsDisplay" style="padding: 10px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e9ecef;">
                                <span style="color: #6c757d;">로딩 중...</span>
                            </div>
                        </div>
                        
                        <!-- 실시간 사용량 표시 섹션 -->
                        <div class="form-group">
                            <label>실시간 사용량:</label>
                            <div id="realTimeUsage" style="padding: 10px; background: #f8f9fa; border-radius: 8px; border: 1px solid #e9ecef;">
                                <span style="color: #6c757d;">로딩 중...</span>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <button class="btn" onclick="createStripeCheckout()">
                                <span class="loading hidden" id="checkoutLoading"></span>
                                💳 Stripe 결제 시작
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- API 공유하기 -->
            <div class="section">
                <h2>📤 API 공유하기</h2>
                <div class="form-grid">
                    <div>
                        <div class="form-group">
                            <label>현재 사용자 선택:</label>
                            <select id="currentUserId" onchange="updateCurrentUser()">
                                <option value="user-001">user-001 (testuser1@example.com) - Free 플랜</option>
                                <option value="user-002" selected>user-002 (testuser2@example.com) - Pro 플랜</option>
                                <option value="user-003">user-003 (admin@example.com) - Pro 플랜</option>
                                <option value="user-004">user-004 (developer@example.com) - Free 플랜</option>
                                <option value="user-005">user-005 (premium@example.com) - Pro 플랜</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>API 이름:</label>
                            <input type="text" id="apiName" placeholder="예: Weather API" value="Test Shared API">
                        </div>
                        <div class="form-group">
                            <label>API 설명:</label>
                            <input type="text" id="apiDescription" placeholder="API에 대한 설명을 입력하세요" value="테스트용 공유 API입니다">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>원본 API ID:</label>
                            <input type="text" id="originalApiId" placeholder="api-001" value="api-001">
                        </div>
                        <div class="form-group">
                            <label>플랜 타입:</label>
                            <select id="planType">
                                <option value="FREE">FREE</option>
                                <option value="PRO" selected>PRO</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <button class="btn" onclick="shareApi()">
                                <span class="loading hidden" id="shareLoading"></span>
                                📤 API 공유하기 (스마트 모드)
                            </button>
                            <button class="btn btn-secondary" onclick="fallbackShareOnly()" style="margin-left: 10px;">
                                <span class="loading hidden" id="fallbackLoading"></span>
                                🔧 기존 방식으로만
                            </button>
                        </div>
                        <div style="font-size: 0.9em; color: #666; margin-top: 5px;">
                            💡 스마트 모드: CustomAPI가 없으면 자동 생성 후 공유 | 기존 방식: CustomAPI가 이미 있어야 함
                        </div>
                    </div>
                </div>
            </div>

            <!-- 내가 공유한 API 목록 -->
            <div class="section">
                <h2>📋 내가 공유한 API</h2>
                <div style="margin-bottom: 20px;">
                    <button class="btn btn-secondary btn-sm" onclick="loadMySharedApis()">
                        🔄 새로고침
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="deleteSelectedApi()" style="margin-left: 10px;">
                        <span class="loading hidden" id="deleteLoading"></span>
                        🗑️ 선택된 API 삭제
                    </button>
                    <button class="btn btn-secondary btn-sm" onclick="debugSharedApis()" style="margin-left: 10px;">
                        🔍 DB 상태 확인
                    </button>
                </div>
                <div id="mySharedApiList" class="api-grid">
                    <!-- 동적으로 로드됨 -->
                </div>
            </div>

            <!-- 전체 공유 API 목록 -->
            <div class="section">
                <h2>🌐 전체 공유 API</h2>
                <div class="form-grid" style="margin-bottom: 20px;">
                    <div>
                        <div class="form-group">
                            <label>검색 키워드:</label>
                            <input type="text" id="searchKeyword" placeholder="API 이름이나 설명으로 검색" value="">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <button class="btn btn-secondary btn-sm" onclick="searchApis()">
                                🔍 검색
                            </button>
                            <button class="btn btn-secondary btn-sm" onclick="loadAllSharedApis()" style="margin-left: 10px;">
                                🔄 전체 목록
                            </button>
                        </div>
                    </div>
                </div>
                <div id="allSharedApiList" class="api-grid">
                    <!-- 동적으로 로드됨 -->
                </div>
            </div>

            <!-- 저장된 API 목록 -->
            <div class="section">
                <h2>💾 저장된 API</h2>
                <div style="margin-bottom: 20px;">
                    <button class="btn btn-secondary btn-sm" onclick="loadSavedApis()">
                        🔄 새로고침
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="deleteSelectedSavedApi()" style="margin-left: 10px;">
                        <span class="loading hidden" id="deleteSavedLoading"></span>
                        🗑️ 선택된 API 삭제
                    </button>
                </div>
                <div id="savedApiList" class="api-grid">
                    <!-- 동적으로 로드됨 -->
                </div>
            </div>
        </div>

        <!-- 상태 메시지 영역 -->
        <div id="statusMessages" style="padding: 0 40px 40px;"></div>
    </div>

    <script>
        // 전역 변수
        let currentUserId = 'user-002';
        let subscriptionUserId = 'user-002';
        let selectedSharedApiId = null;
        let selectedSavedApiId = null;

        // 유틸리티 함수들
        function showMessage(message, type = 'info') {
            const messagesDiv = document.getElementById('statusMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `status-message ${type}`;
            messageDiv.textContent = message;
            messagesDiv.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }
        
        function showLoading(elementId, show) {
            const loading = document.getElementById(elementId);
            if (loading) {
                if (show) {
                    loading.classList.remove('hidden');
                } else {
                    loading.classList.add('hidden');
                }
            }
        }

        // 현재 사용자 업데이트
        function updateCurrentUser() {
            currentUserId = document.getElementById('currentUserId').value;
            showMessage(`공유 API 사용자가 ${currentUserId}로 변경되었습니다.`, 'info');
            loadMySharedApis();
            loadSavedApis();
        }

        // 구독 사용자 업데이트
        function updateSubscriptionUser() {
            subscriptionUserId = document.getElementById('subscriptionUserId').value;
            showMessage(`구독 사용자가 ${subscriptionUserId}로 변경되었습니다.`, 'info');
            // 구독 상태 업데이트 (추후 구현)
            updateSubscriptionStatus();
        }

        // 구독 상태 업데이트
        function updateSubscriptionStatus() {
            const statusDiv = document.getElementById('currentSubscriptionStatus');
            statusDiv.innerHTML = `<span style="color: #28a745;">✅ ${subscriptionUserId} - 활성 구독</span>`;
        }

        // Stripe Checkout 세션 생성
        async function createStripeCheckout() {
            const priceId = document.getElementById('planSelection').value;
            
            showLoading('checkoutLoading', true);
            
            try {
                const response = await fetch('/api/subscription/checkout', {
                    method: 'POST',
                    headers: {

        // URL 파라미터에서 결제 상태 확인
        function checkPaymentStatus() {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentStatus = urlParams.get('payment');
            
            if (paymentStatus === 'success') {
                showMessage('🎉 결제가 성공적으로 완료되었습니다! 구독이 활성화되었습니다.', 'success');
                
                // 구독 상태 업데이트
                setTimeout(() => {
                    updateSubscriptionStatus();
                    // 구독 업데이트 API 호출 (필요시)
                    updateSubscriptionAfterPayment();
                }, 1000);
                
                // URL에서 payment 파라미터 제거
                window.history.replaceState({}, document.title, window.location.pathname);
                
            } else if (paymentStatus === 'cancel') {
                showMessage('❌ 결제가 취소되었습니다. 언제든지 다시 시도하실 수 있습니다.', 'error');
                
                // URL에서 payment 파라미터 제거
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // 결제 성공/실패 후 처리 함수
        function handlePaymentResult() {
            const urlParams = new URLSearchParams(window.location.search);
            const success = urlParams.get('success');
            const canceled = urlParams.get('canceled');
            
            if (success === 'true') {
                showMessage('✅ 결제가 성공적으로 완료되었습니다! DB 업데이트를 확인 중입니다...', 'success');
                checkSubscriptionUpdate();
            } else if (canceled === 'true') {
                showMessage('❌ 결제가 취소되었습니다.', 'warning');
            }
        }

        // 구독 업데이트 확인 (폴링 방식)
        async function checkSubscriptionUpdate(attempts = 0, maxAttempts = 10) {
            if (attempts >= maxAttempts) {
                showMessage('⚠️ DB 업데이트 확인 시간이 초과되었습니다. 수동으로 새로고침해주세요.', 'warning');
                return;
            }

            try {
                const response = await fetch(`/api/subscription/limits-status`, {
                    method: 'GET',
                    headers: {
                        'X-User-Id': subscriptionUserId
                    }
                });

                const result = await response.json();

                if (result.success && result.data.hasActiveSubscription) {
                    showMessage(`🎉 구독이 성공적으로 활성화되었습니다! 플랜: ${result.data.planName}`, 'success');
                    
                    // 대시보드 업데이트
                    updateSubscriptionStatus(result.data);
                    updatePlanLimitsDisplay(result.data);
                    
                    return;
                } else {
                    // 3초 후 재시도
                    setTimeout(() => {
                        checkSubscriptionUpdate(attempts + 1, maxAttempts);
                    }, 3000);
                    
                    if (attempts === 0) {
                        showMessage(`🔄 DB 업데이트 확인 중... (${attempts + 1}/${maxAttempts})`, 'info');
                    }
                }
            } catch (error) {
                console.error('구독 상태 확인 오류:', error);
                setTimeout(() => {
                    checkSubscriptionUpdate(attempts + 1, maxAttempts);
                }, 3000);
            }
        }

        // 구독 상태 업데이트
        function updateSubscriptionStatus(subscriptionData) {
            const statusDiv = document.getElementById('currentSubscriptionStatus');
            if (statusDiv) {
                statusDiv.innerHTML = `
                    <div style="color: #28a745; font-weight: 600;">
                        ✅ 활성 구독: ${subscriptionData.planName}
                        <br>
                        <small style="color: #6c757d;">
                            구독 ID: ${subscriptionData.subscriptionId}
                            <br>
                            최종 업데이트: ${new Date().toLocaleString()}
                        </small>
                    </div>
                `;
            }
        }

        // 플랜 제한 표시 업데이트
        function updatePlanLimitsDisplay(subscriptionData) {
            const limitsDiv = document.getElementById('planLimitsDisplay');
            if (limitsDiv) {
                limitsDiv.innerHTML = `
                    <div class="plan-limits">
                        <h4>📊 현재 플랜 제한</h4>
                        <ul>
                            <li>Custom API: ${subscriptionData.features?.maxCustomApiCount || 'N/A'}개</li>
                            <li>공유 API: ${subscriptionData.features?.maxSharedApiCount || 'N/A'}개</li>
                            <li>분당 요청: ${subscriptionData.features?.rateLimitPerMinute || 'N/A'}회</li>
                            <li>시간당 요청: ${subscriptionData.features?.rateLimitPerHour || 'N/A'}회</li>
                            <li>일일 요청: ${subscriptionData.features?.rateLimitPerDay || 'N/A'}회</li>
                        </ul>
                    </div>
                `;
            }
        }

        // 실시간 사용량 모니터링
        async function startUsageMonitoring() {
            setInterval(async () => {
                try {
                    const response = await fetch('/api/plan/usage-stats', {
                        method: 'GET',
                        headers: {
                            'X-User-Id': subscriptionUserId
                        }
                    });

                    const result = await response.json();
                    if (result.success) {
                        updateUsageDisplay(result.data);
                    }
                } catch (error) {
                    console.error('사용량 모니터링 오류:', error);
                }
            }, 30000); // 30초마다 업데이트
        }

        // 사용량 표시 업데이트
        function updateUsageDisplay(usageData) {
            const usageDiv = document.getElementById('realTimeUsage');
            if (usageDiv) {
                usageDiv.innerHTML = `
                    <div class="usage-stats">
                        <h4>📈 실시간 사용량</h4>
                        <div class="usage-grid">
                            <div class="usage-item">
                                <span class="usage-label">분간:</span>
                                <span class="usage-value">${usageData.currentMinute}회</span>
                            </div>
                            <div class="usage-item">
                                <span class="usage-label">시간:</span>
                                <span class="usage-value">${usageData.currentHour}회</span>
                            </div>
                            <div class="usage-item">
                                <span class="usage-label">일간:</span>
                                <span class="usage-value">${usageData.currentDay}회</span>
                            </div>
                            <div class="usage-item">
                                <span class="usage-label">월간:</span>
                                <span class="usage-value">${usageData.currentMonth}회</span>
                            </div>
                        </div>
                        <small>마지막 업데이트: ${new Date(usageData.timestamp).toLocaleTimeString()}</small>
                    </div>
                `;
            }
        }

        // 페이지 로드 시 결제 결과 처리 및 모니터링 시작
        window.addEventListener('load', function() {
            handlePaymentResult();
            startUsageMonitoring();
        });
    </script>
</body>
</html>
