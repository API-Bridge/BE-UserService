<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공유 API 전용 테스트</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            padding: 30px 40px;
            text-align: center;
        }
        
        .header h1 {
            margin: 0;
            font-size: 2.2em;
            font-weight: 700;
        }
        
        .content {
            padding: 40px;
        }
        
        .section {
            background: #f8fafc;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            border: 1px solid #e2e8f0;
        }
        
        .section h2 {
            margin-top: 0;
            color: #2d3748;
            border-bottom: 3px solid #4299e1;
            padding-bottom: 10px;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        .btn-sm {
            padding: 8px 16px;
            font-size: 14px;
        }
        
        .api-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .api-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #e5e7eb;
            transition: all 0.3s ease;
        }
        
        .api-card:hover {
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }
        
        .api-card.selected {
            border-color: #10b981;
            background: #f0fdf4;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }
        
        .api-title {
            font-weight: 600;
            font-size: 1.1em;
            color: #1f2937;
            margin-bottom: 8px;
        }
        
        .api-description {
            color: #6b7280;
            margin-bottom: 12px;
            font-size: 0.9em;
        }
        
        .api-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85em;
            color: #9ca3af;
        }
        
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75em;
            font-weight: 600;
        }
        
        .badge.active {
            background: #d1fae5;
            color: #065f46;
        }
        
        .badge.inactive {
            background: #fee2e2;
            color: #991b1b;
        }
        
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        
        .loading.hidden {
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 500;
        }
        
        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }
        
        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }
        
        .message.info {
            background: #dbeafe;
            color: #1e40af;
            border: 1px solid #93c5fd;
        }
        
        .info {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: #6b7280;
        }
        
        .error {
            background: #fee2e2;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            color: #991b1b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔗 공유 API 전용 테스트</h1>
            <p>공유 API 기능을 완전하게 테스트할 수 있는 전용 페이지입니다</p>
        </div>
        
        <div class="content">
            <!-- API 공유 섹션 -->
            <div class="section">
                <h2>📤 API 공유하기</h2>
                <div class="form-grid">
                    <div>
                        <div class="form-group">
                            <label>사용자 ID:</label>
                            <select id="userId">
                                <option value="user-001">user-001 (testuser1@example.com) - Free 플랜</option>
                                <option value="user-002" selected>user-002 (testuser2@example.com) - Pro 플랜</option>
                                <option value="user-003">user-003 (admin@example.com) - Pro 플랜</option>
                                <option value="user-004">user-004 (developer@example.com) - Free 플랜</option>
                                <option value="user-005">user-005 (premium@example.com) - Pro 플랜</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>API 이름:</label>
                            <input type="text" id="apiName" placeholder="예: Weather API" value="테스트 공유 API">
                        </div>
                        <div class="form-group">
                            <label>API 설명:</label>
                            <input type="text" id="apiDescription" placeholder="API에 대한 설명을 입력하세요" value="전용 페이지에서 테스트하는 공유 API입니다">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <label>원본 API ID:</label>
                            <input type="text" id="originalApiId" placeholder="api-001" value="api-shared-test-001">
                        </div>
                        <div class="form-group">
                            <label>플랜 타입:</label>
                            <select id="planName">
                                <option value="FREE">FREE</option>
                                <option value="PRO" selected>PRO</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <button class="btn" onclick="shareApiComplete()">
                                <span class="loading hidden" id="shareLoading"></span>
                                📤 완전한 공유 테스트
                            </button>
                            <button class="btn btn-secondary" onclick="shareApiOnly()" style="margin-left: 10px;">
                                <span class="loading hidden" id="shareOnlyLoading"></span>
                                🔧 공유만 (기존방식)
                            </button>
                        </div>
                        <div style="font-size: 0.9em; color: #666; margin-top: 5px;">
                            💡 완전한 테스트: CustomAPI 자동 생성 + 공유 | 공유만: 기존 CustomAPI 필요
                        </div>
                    </div>
                </div>
            </div>

            <!-- 내가 공유한 API 목록 -->
            <div class="section">
                <h2>📋 내가 공유한 API</h2>
                <div style="margin-bottom: 20px;">
                    <button class="btn btn-secondary btn-sm" onclick="loadMySharedApis()">
                        🔄 새로고침
                    </button>
                    <button class="btn btn-danger btn-sm" onclick="deleteSelectedApi()" style="margin-left: 10px;">
                        <span class="loading hidden" id="deleteLoading"></span>
                        🗑️ 선택된 API 삭제
                    </button>
                    <button class="btn btn-secondary btn-sm" onclick="debugSharedApis()" style="margin-left: 10px;">
                        🔍 DB 상태 확인
                    </button>
                </div>
                <div id="mySharedApiList" class="api-grid">
                    <!-- 동적으로 로드됨 -->
                </div>
            </div>

            <!-- 전체 공유 API 목록 -->
            <div class="section">
                <h2>🌐 전체 공유 API</h2>
                <div class="form-grid" style="margin-bottom: 20px;">
                    <div>
                        <div class="form-group">
                            <label>검색 키워드:</label>
                            <input type="text" id="searchKeyword" placeholder="API 이름이나 설명으로 검색" value="">
                        </div>
                    </div>
                    <div>
                        <div class="form-group">
                            <button class="btn btn-secondary btn-sm" onclick="searchApis()">
                                🔍 검색
                            </button>
                            <button class="btn btn-secondary btn-sm" onclick="loadAllSharedApis()" style="margin-left: 10px;">
                                🔄 전체 목록
                            </button>
                        </div>
                    </div>
                </div>
                <div id="allSharedApiList" class="api-grid">
                    <!-- 동적으로 로드됨 -->
                </div>
            </div>
        </div>

        <!-- 상태 메시지 영역 -->
        <div id="statusMessages" style="padding: 0 40px 40px;"></div>
    </div>

    <script>
        // 전역 변수
        let currentUserId = 'user-002';
        let selectedSharedApiId = null;

        // URL 파라미터에서 결제 상태 확인
        function checkPaymentStatus() {
            const urlParams = new URLSearchParams(window.location.search);
            const paymentStatus = urlParams.get('payment');
            
            if (paymentStatus === 'success') {
                showMessage('🎉 결제가 성공적으로 완료되었습니다! Pro 구독이 활성화되었습니다.', 'success');
                
                // URL에서 payment 파라미터 제거
                window.history.replaceState({}, document.title, window.location.pathname);
                
            } else if (paymentStatus === 'cancel') {
                showMessage('❌ 결제가 취소되었습니다. 언제든지 다시 시도하실 수 있습니다.', 'error');
                
                // URL에서 payment 파라미터 제거
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            // 결제 상태 먼저 확인
            checkPaymentStatus();
            
            loadMySharedApis();
            loadAllSharedApis();
            
            // 사용자 ID 변경 시 다시 로드
            document.getElementById('userId').addEventListener('change', function() {
                currentUserId = this.value;
                loadMySharedApis();
            });
        });

        // 완전한 API 공유 (CustomApi 생성 + 공유)
        async function shareApiComplete() {
            const apiName = document.getElementById('apiName').value.trim();
            const description = document.getElementById('apiDescription').value.trim();
            const originalApiId = document.getElementById('originalApiId').value.trim();
            const planName = document.getElementById('planName').value;
            const userId = document.getElementById('userId').value;
            
            if (!apiName || !description || !originalApiId) {
                showMessage('모든 필드를 입력해주세요.', 'error');
                return;
            }
            
            showLoading('shareLoading', true);
            
            try {
                const response = await fetch('/test/api/complete-share-test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        userId: userId,
                        apiId: originalApiId,
                        apiName: apiName,
                        description: description,
                        planName: planName
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const customApiCreated = result.data.customApiCreated ? ' (새 CustomApi 생성됨)' : ' (기존 CustomApi 사용됨)';
                    showMessage('완전한 공유 테스트 성공!' + customApiCreated, 'success');
                    loadMySharedApis();
                    loadAllSharedApis();
                    
                    // 폼 초기화
                    document.getElementById('apiName').value = '';
                    document.getElementById('apiDescription').value = '';
                } else {
                    showMessage('완전한 공유 테스트 실패: ' + result.message, 'error');
                }
            } catch (error) {
                console.error('완전한 공유 테스트 오류:', error);
                showMessage('완전한 공유 테스트 중 오류가 발생했습니다: ' + error.message, 'error');
            } finally {
                showLoading('shareLoading', false);
            }
        }

        // 기존 방식의 API 공유
        async function shareApiOnly() {
            const apiName = document.getElementById('apiName').value.trim();
            const description = document.getElementById('apiDescription').value.trim();
            const originalApiId = document.getElementById('originalApiId').value.trim();
            const planName = document.getElementById('planName').value;
            const userId = document.getElementById('userId').value;
            
            if (!apiName || !description || !originalApiId) {
                showMessage('모든 필드를 입력해주세요.', 'error');
                return;
            }
            
            showLoading('shareOnlyLoading', true);
            
            try {
                const requestBody = new URLSearchParams({
                    customApiId: originalApiId,
                    planName: planName,
                    apiName: apiName,
                    apiDescription: description
                });
                
                const response = await fetch('/api/shared-apis/share', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-User-Id': userId
                    },
                    body: requestBody
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('API가 성공적으로 공유되었습니다! (기존 방식)', 'success');
                    loadMySharedApis();
                    loadAllSharedApis();
                    
                    // 폼 초기화
                    document.getElementById('apiName').value = '';
                    document.getElementById('apiDescription').value = '';
                } else {
                    showMessage('API 공유 실패: ' + result.message, 'error');
                }
            } catch (error) {
                console.error('기존 방식 API 공유 오류:', error);
                showMessage('API 공유 중 오류가 발생했습니다: ' + error.message, 'error');
            } finally {
                showLoading('shareOnlyLoading', false);
            }
        }

        // 내가 공유한 API 목록 로드
        async function loadMySharedApis() {
            try {
                const userId = document.getElementById('userId').value;
                const response = await fetch('/api/shared-apis/my', {
                    headers: {
                        'X-User-Id': userId
                    }
                });
                const result = await response.json();
                
                const listDiv = document.getElementById('mySharedApiList');
                if (result.success && result.data && result.data.length > 0) {
                    displayMySharedApis(result.data);
                } else {
                    listDiv.innerHTML = '<div class="info">공유한 API가 없습니다.</div>';
                }
            } catch (error) {
                console.error('내 공유 API 목록 로드 실패:', error);
                document.getElementById('mySharedApiList').innerHTML = '<div class="error">목록 로드 실패</div>';
            }
        }

        // 전체 공유 API 목록 로드
        async function loadAllSharedApis() {
            try {
                const response = await fetch('/api/shared-apis?page=0&size=20');
                const result = await response.json();
                
                const listDiv = document.getElementById('allSharedApiList');
                if (result.success && result.data) {
                    const apis = result.data.content || result.data;
                    if (apis.length > 0) {
                        displayAllSharedApis(apis);
                    } else {
                        listDiv.innerHTML = '<div class="info">공유된 API가 없습니다.</div>';
                    }
                } else {
                    listDiv.innerHTML = '<div class="info">공유된 API가 없습니다.</div>';
                }
            } catch (error) {
                console.error('전체 공유 API 목록 로드 실패:', error);
                document.getElementById('allSharedApiList').innerHTML = '<div class="error">목록 로드 실패</div>';
            }
        }

        // API 검색
        async function searchApis() {
            const keyword = document.getElementById('searchKeyword').value.trim();
            
            if (!keyword) {
                showMessage('검색 키워드를 입력해주세요.', 'error');
                return;
            }
            
            try {
                const response = await fetch(`/api/shared-apis/search?keyword=${encodeURIComponent(keyword)}`);
                const result = await response.json();
                
                const listDiv = document.getElementById('allSharedApiList');
                if (result.success && result.data && result.data.length > 0) {
                    displayAllSharedApis(result.data);
                    showMessage(`'${keyword}' 검색 결과: ${result.data.length}개`, 'success');
                } else {
                    listDiv.innerHTML = '<div class="info">검색 결과가 없습니다.</div>';
                    showMessage(`'${keyword}' 검색 결과가 없습니다.`, 'info');
                }
            } catch (error) {
                console.error('검색 실패:', error);
                showMessage('검색 중 오류가 발생했습니다: ' + error.message, 'error');
            }
        }

        // 선택된 공유 API 삭제
        async function deleteSelectedApi() {
            if (!selectedSharedApiId) {
                showMessage('삭제할 API를 선택해주세요.', 'error');
                return;
            }
            
            if (!confirm('정말로 이 API의 공유를 취소하시겠습니까?')) {
                return;
            }
            
            showLoading('deleteLoading', true);
            
            try {
                const userId = document.getElementById('userId').value;
                const response = await fetch('/api/shared-apis/unshare', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'X-User-Id': userId
                    },
                    body: new URLSearchParams({
                        customApiId: selectedSharedApiId
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage('API 공유가 취소되었습니다.', 'success');
                    selectedSharedApiId = null;
                    loadMySharedApis();
                    loadAllSharedApis();
                } else {
                    showMessage('삭제 실패: ' + result.message, 'error');
                }
            } catch (error) {
                showMessage('삭제 중 오류가 발생했습니다: ' + error.message, 'error');
            } finally {
                showLoading('deleteLoading', false);
            }
        }

        // 데이터베이스 공유 API 상태 디버깅
        async function debugSharedApis() {
            try {
                const response = await fetch('/test/api/debug-shared-apis');
                const result = await response.json();
                
                if (result.success) {
                    const totalCount = result.data.totalCount;
                    const apis = result.data.apis;
                    
                    console.log('데이터베이스 공유 API 상태:', result.data);
                    
                    let message = `데이터베이스에 ${totalCount}개의 활성 공유 API가 있습니다.`;
                    if (apis.length > 0) {
                        message += '\n\n최근 API들:';
                        apis.slice(0, 3).forEach(api => {
                            message += `\n- ${api.apiName} (${api.isActive ? '활성' : '비활성'})`;
                        });
                    }
                    
                    showMessage(message, 'info');
                } else {
                    showMessage('DB 상태 확인 실패: ' + result.message, 'error');
                }
            } catch (error) {
                console.error('DB 상태 확인 오류:', error);
                showMessage('DB 상태 확인 중 오류가 발생했습니다: ' + error.message, 'error');
            }
        }

        // 공유 API 선택
        function selectSharedApi(apiId) {
            selectedSharedApiId = apiId;
            loadMySharedApis(); // 선택 상태 업데이트를 위해 다시 로드
        }

        // 내가 공유한 API 목록 표시
        function displayMySharedApis(apis) {
            const listDiv = document.getElementById('mySharedApiList');
            
            listDiv.innerHTML = apis.map(api => `
                <div class="api-card ${selectedSharedApiId === api.originalApiId ? 'selected' : ''}" 
                     onclick="selectSharedApi('${api.originalApiId}')" style="cursor: pointer;">
                    <div class="api-title">${api.apiName || 'Unknown API'}</div>
                    <div class="api-description">${api.description || 'No description'}</div>
                    <div class="api-meta">
                        <span>🆔 ${api.sharedApiId}</span>
                        <span class="badge ${api.isActive ? 'active' : 'inactive'}">${api.isActive ? '활성' : '비활성'}</span>
                    </div>
                    <div class="api-meta">
                        <span>📅 ${new Date(api.createdAt).toLocaleDateString()}</span>
                        <span>📊 ${api.dataCount || 0}회 사용</span>
                    </div>
                </div>
            `).join('');
        }

        // 전체 공유 API 목록 표시
        function displayAllSharedApis(apis) {
            const listDiv = document.getElementById('allSharedApiList');
            
            listDiv.innerHTML = apis.map(api => `
                <div class="api-card">
                    <div class="api-title">${api.apiName || 'Unknown API'}</div>
                    <div class="api-description">${api.description || 'No description'}</div>
                    <div class="api-meta">
                        <span>👤 ${api.creatorId}</span>
                        <span>📊 ${api.dataCount || 0}회 사용</span>
                    </div>
                    <div class="api-meta">
                        <span>📅 ${new Date(api.createdAt).toLocaleDateString()}</span>
                        <span class="badge active">공유됨</span>
                    </div>
                </div>
            `).join('');
        }

        // 로딩 표시
        function showLoading(id, show) {
            const element = document.getElementById(id);
            if (element) {
                if (show) {
                    element.classList.remove('hidden');
                } else {
                    element.classList.add('hidden');
                }
            }
        }

        // 메시지 표시
        function showMessage(message, type = 'info') {
            const messagesDiv = document.getElementById('statusMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = message;
            
            messagesDiv.appendChild(messageDiv);
            
            // 5초 후 자동 제거
            setTimeout(() => {
                if (messageDiv.parentNode) {
                    messageDiv.parentNode.removeChild(messageDiv);
                }
            }, 5000);
        }
    </script>
</body>
</html>
