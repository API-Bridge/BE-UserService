spring:
  application:
    name: user-svc
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Swagger/OpenAPI 설정
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    doc-expansion: none
  cache:
    disabled: true

  # JPA 설정 (Amazon Corretto 17 최적화)
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        jdbc.batch_versioned_data: true
        globally_quoted_identifiers: false
        globally_quoted_identifiers_skip_column_definitions: true
    show-sql: false
    open-in-view: false

  # Kafka 설정 (개발 환경에서는 비활성화)
  # kafka:
  #   bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
  #   consumer:
  #     group-id: ${SERVICE_NAME:user-svc}-group
  #     auto-offset-reset: earliest
  #     key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  #     value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
  #     properties:
  #       spring.json.trusted.packages: "*"
  #       max.poll.records: 500
  #       enable.auto.commit: false
  #   producer:
  #     key-serializer: org.apache.kafka.common.serialization.StringSerializer
  #     value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  #     properties:
  #       acks: all
  #       retries: 3

  # Redis 설정 (개발 환경에서는 비활성화)
  # redis:
  #   lettuce:
  #     pool:
  #       max-active: 8
  #       max-idle: 8
  #       min-idle: 0

  # 데이터베이스 설정
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/user_service_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1111}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
  # data:
  #   redis:
  #     host: ${REDIS_HOST:localhost}
  #     port: ${REDIS_PORT:6379}
  #     timeout: 2000ms

# Auth0 설정 (개발 환경에서는 비활성화)
# auth0:
#   issuerUri: ${AUTH0_ISSUER_URI:https://dev-your-domain.auth0.com/}
#   audience: ${AUTH0_AUDIENCE:https://api.dev.yourservice.com}

# 개발 환경용 기본 보안 설정
  security:
    user:
      name: admin
      password: admin
      roles: USER,ADMIN

# AWS 설정 (개발 환경에서는 비활성화)
# aws:
#   region: ${AWS_REGION:ap-northeast-2}
#   s3:
#     bucket: ${S3_BUCKET_NAME:your-bucket-name}
#   secretsmanager:
#     region: ${AWS_REGION:ap-northeast-2}

# Circuit Breaker 설정 (Resilience4j)
resilience4j:
  circuitbreaker:
    instances:
      default:
        slidingWindowSize: 100
        permittedNumberOfCallsInHalfOpenState: 10
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 20
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 3s
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 1s
        exponentialBackoffMultiplier: 2
  bulkhead:
    instances:
      default:
        maxConcurrentCalls: 10

# 로깅 설정
logging:
  level:
    root: INFO
    org.example.usersvc: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"

management:
  # 웹 엔드포인트 노출 설정
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,loggers
      base-path: /actuator

  # 개별 엔드포인트 상세 설정
  endpoint:
    health:
      show-details: when_authorized

  # 프로메테우스 익스포터 설정
  prometheus:
    metrics:
      export:
        enabled: true

  # 모든 메트릭에 적용될 공통 태그 설정 (여기 위치가 올바릅니다)
  metrics:
    tags:
      service: user-svc
      version: ${BUILD_VERSION:dev}

  # 분산 트레이싱 샘플링 설정
  tracing:
    sampling:
      probability: 1.0

# 서버 설정
server:
  port: ${SERVER_PORT:8083}
  servlet:
    # context-path: /api/v1  # 컨텍스트 패스 제거
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 8192

# OpenAPI 설정은 위에서 통합 설정됨

---
# 개발 환경 설정
spring:
  config:
    activate:
      on-profile: dev
  
  # 개발 환경에서는 H2 인메모리 DB 사용
  datasource:
    url: jdbc:h2:mem:devdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        
  sql:
    init:
      mode: never
  # kafka:
  #   consumer:
  #     group-id: user-svc-dev-group

logging:
  level:
    org.example.usersvc: DEBUG
    org.springframework.security: DEBUG

---
# 프로덕션 환경 설정
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.example.usersvc: INFO
    org.springframework.security: WARN
  file:
    name: logs/user-svc.log

management:
  endpoint:
    health:
      show-details: never